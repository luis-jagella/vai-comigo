name: Funcionalidade
description: Propor uma capacidade ou melhoria de produto.
title: "[Feature]: "
labels: ["type: feature", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: Qual problema de usuário precisamos resolver?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Resultado esperado
      description: Como saberemos que a mudança ajudou?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      placeholder: "- [ ] Critério verificável"
    validations:
      required: true
  - type: checkboxes
    id: quality
    attributes:
      label: Aspectos obrigatórios
      options:
        - label: Considerei acessibilidade.
        - label: Considerei segurança e privacidade.
