name: Erro
description: Relatar comportamento incorreto sem incluir dados pessoais.
title: "[Bug]: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: Não inclua endereços, telefones, coordenadas, tokens ou dados reais de viagem.
  - type: textarea
    id: description
    attributes:
      label: Descrição
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão ou commit
